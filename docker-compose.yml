services:
  client:
    build: ./client
    container_name: client
    restart: always
    ports:
      - "81:80"
    env_file:
      - .env
    networks:
      - fintrack
    depends_on:
      - server
  server:
    build: ./server
    container_name: server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - fintrack
    depends_on:
       database:
         condition: service_healthy
  database:
    container_name: database
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - fintrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fintrack"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data:
networks:
  fintrack:
    driver: bridge
