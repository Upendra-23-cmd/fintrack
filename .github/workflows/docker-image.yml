    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repo vars
        run: |
          echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]' | sed 's#.*/##')" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}-frontend:${IMAGE_TAG} ./client
          docker push ghcr.io/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}-frontend:${IMAGE_TAG}

      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}-backend:${IMAGE_TAG} ./server
          docker push ghcr.io/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}-backend:${IMAGE_TAG}