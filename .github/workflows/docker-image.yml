name: CI-buildandpush-image

on:
  push:
    branches:
      - main

jobs:
  buildandpush:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/fintrack-frontend:${IMAGE_TAG} ./client
          docker push ghcr.io/${{ github.repository }}/fintrack-frontend:${IMAGE_TAG}

      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/fintrack-backend:${IMAGE_TAG} ./server
          docker push ghcr.io/${{ github.repository }}/fintrack-backend:${IMAGE_TAG}
