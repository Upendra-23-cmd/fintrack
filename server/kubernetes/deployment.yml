apiVersion: apps/v1
kind: Deployment
metadata: 
  name: fintrack-backend
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: fintrack-backend
  template:
    metadata:
      labels:
        app: fintrack-backend
    spec:
      containers:
       - name: backend
         image: upendra1889/fintrack-backend:latest
         ports:
           containerPort: 5000